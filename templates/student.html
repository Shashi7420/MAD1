<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h2 {
            text-align: center;
        }
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 10px;
            border: 1px solid gray;
            text-align: center;
        }
        th {
            background-color: #333;
            color: white;
        }
        button {
            padding: 5px 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: darkgreen;
        }
        .logout {
            display: block;
            width: 100px;
            margin: 20px auto;
            text-align: center;
            padding: 10px;
            background: red;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

<h2>Student Dashboard</h2>

<h3 style="text-align:center;">Available Drives</h3>

<table>
<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Action</th>
</tr>

{% for d in drives %}
<tr>
    <td>{{ d[0] }}</td>
    <td>{{ d[2] }}</td>
    <td>
        <form method="post" action="/apply">
            <input type="hidden" name="drive_id" value="{{ d[0] }}">
            <button type="submit">Apply</button>
        </form>
    </td>
</tr>
{% endfor %}

</table>

<a href="/" class="logout">Logout</a>

</body>
</html>
