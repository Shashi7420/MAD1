<!DOCTYPE html>
<html>
<body>
<h2>Company Dashboard</h2>

<h3>Create Drive</h3>
<form method="post">
<input name="title" placeholder="Job Title"><br>
<textarea name="desc" placeholder="Description"></textarea><br>
<button type="submit">Create</button>
</form>

<h3>Your Drives</h3>
<table border="1">
<tr><th>ID</th><th>Title</th></tr>
{% for d in drives %}
<tr>
<td>{{d[0]}}</td>
<td>{{d[2]}}</td>
</tr>
{% endfor %}
</table>

<a href="/">Logout</a>
</body>
</html>
