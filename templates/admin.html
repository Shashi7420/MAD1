<!DOCTYPE html>
<html>
<body>
<h2>Admin Dashboard</h2>

<h3>Companies</h3>
<table border="1">
<tr><th>ID</th><th>Name</th><th>Approved</th></tr>
{% for c in companies %}
<tr>
<td>{{c[0]}}</td>
<td>{{c[2]}}</td>
<td>{{c[3]}}</td>
</tr>
{% endfor %}
</table>

<h3>Drives</h3>
<table border="1">
<tr><th>ID</th><th>Title</th><th>Approved</th></tr>
{% for d in drives %}
<tr>
<td>{{d[0]}}</td>
<td>{{d[2]}}</td>
<td>{{d[4]}}</td>
</tr>
{% endfor %}
</table>

<a href="/">Logout</a>
</body>
</html>
